# VulnRadar Watchlist Configuration
# ==================================
# Matching is case-insensitive and uses substring matching by default.
#
# HOW TO FIND VALID NAMES:
#   1. Run: python etl.py --list-vendors         (shows all vendors in CVE data)
#   2. Run: python etl.py --list-products        (shows all products)
#   3. Run: python etl.py --search "apache"      (fuzzy search both)
#   4. Run: python etl.py --validate-watchlist   (check for typos)
#   5. Browse: https://cve.org and look at affected products
#
# For more examples, see: watchlist.example.yaml
# ==================================

# ============================================================================
# VENDORS - Organizations that publish software
# ============================================================================
vendors:
  # 大型软件与科技巨头
  - microsoft
  - google
  - apple
  - adobe
  - oracle
  - sap
  - ibm
  - cisco
  - vmware
  - huawei

