# ============================================================================
# EXCLUSIONS - Filter out noise (optional)
# ============================================================================
exclude_vendors:
  - n/a
  - unknown
  - unspecified

exclude_products:
  - n/a
  - unknown

# ============================================================================
# THRESHOLDS - Minimum severity to include (optional)
# ============================================================================
thresholds:
  min_cvss: 7.0         # High+ severity only (keeps file size manageable)
  # min_epss: 0.0       # 0.0 = all, 0.1 = 10%+ exploit probability

# ============================================================================
# BEHAVIOR FLAGS (optional)
# ============================================================================
# options:
#   always_include_kev: true       # Include CISA KEV even if not in watchlist
#   always_include_patchthis: true # Include PatchThis items
#   match_mode: substring          # 'substring', 'exact', or 'regex'
